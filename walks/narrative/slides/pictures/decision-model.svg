<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="960" height="330" fill="#ffffff"/>
  <g font-size="20" font-weight="600" fill="#17202b" text-anchor="middle">
    <rect x="20" y="20" width="190" height="150" rx="8" fill="#eef1f5" stroke="#6f7b8b"/>
    <text x="115" y="62">A request</text>
    <rect x="260" y="20" width="160" height="150" rx="8" fill="#e4ebf9" stroke="#2456b5"/>
    <text x="340" y="62">Pack</text>
    <rect x="470" y="20" width="220" height="150" rx="8" fill="#e3f4ea" stroke="#1d7a4c"/>
    <text x="580" y="62">Qwen2.5-0.5B</text>
    <rect x="740" y="20" width="200" height="150" rx="8" fill="#fbefdd" stroke="#a85b00"/>
    <text x="840" y="62">Pointer head</text>
  </g>
  <g font-size="16" fill="#4d5969" text-anchor="middle">
    <text x="115" y="96">a state, and</text><text x="115" y="118">questions, each</text><text x="115" y="140">with its options</text>
    <text x="340" y="96">everything into</text><text x="340" y="118">one sequence</text><text x="340" y="140">of tokens</text>
    <text x="580" y="96">a small language model</text><text x="580" y="118">with a LoRA adapter</text><text x="580" y="140">and a special mask</text>
    <text x="840" y="96">scores each option</text><text x="840" y="118">against the</text><text x="840" y="140">decision token</text>
  </g>
  <g stroke="#6f7b8b" stroke-width="2.5" fill="#6f7b8b">
    <line x1="214" y1="95" x2="248" y2="95"/><polygon points="248,89 258,95 248,101"/>
    <line x1="424" y1="95" x2="458" y2="95"/><polygon points="458,89 468,95 458,101"/>
    <line x1="694" y1="95" x2="728" y2="95"/><polygon points="728,89 738,95 728,101"/>
    <line x1="840" y1="174" x2="840" y2="208"/><polygon points="834,208 840,218 846,208"/>
  </g>
  <rect x="660" y="224" width="280" height="92" rx="8" fill="#ffffff" stroke="#a85b00"/>
  <text x="800" y="252" font-size="18" font-weight="600" fill="#17202b" text-anchor="middle">A probability per option</text>
  <g font-size="15" fill="#4d5969" font-family="ui-monospace, Menlo, monospace">
    <text x="680" y="280">milk: sheep 0.81  cow 0.12</text>
    <text x="680" y="302">vegetarian: 0.08</text>
  </g>
  <g font-size="17" fill="#17202b">
    <text x="20" y="252">Frozen: the language model, about half a billion parameters.</text>
    <text x="20" y="282">Trained: the adapter and the head, about nine million.</text>
  </g>
</svg>
