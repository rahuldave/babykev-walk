<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1470 680">
<rect width="1470" height="680" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a85b00"/></marker></defs>
<rect x="12" y="18" width="971" height="646" rx="8" fill="#f6f8fa"/>
<g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#24292e">
<text x="24" y="40"><tspan fill="#6a737d" font-style="italic"># babykev: every task is a recipe here. `just` lists them; `just help VERB` explains one.</tspan></text>
<text x="24" y="88"><tspan fill="#005cc5">program</tspan> := <tspan fill="#032f62">&quot;babykev&quot;</tspan></text>
<text x="24" y="136"><tspan fill="#6a737d" font-style="italic"># Each word after a recipe&#x27;s name reaches its commands whole, as &quot;$1&quot;, &quot;$2&quot; and so on; &quot;$@&quot; is all of them</tspan></text>
<text x="24" y="160">set positional-arguments</text>
<text x="24" y="208"><tspan fill="#6f42c1">[private]</tspan></text>
<text x="24" y="232"><tspan fill="#005cc5" font-weight="700">default</tspan><tspan fill="#e36209"></tspan>:</text>
<text x="60" y="256">@just --list --unsorted</text>
<text x="24" y="304"><tspan fill="#6a737d" font-style="italic"># Explain a verb: its line, and the program&#x27;s flags where the program has them. Alone, the list</tspan></text>
<text x="24" y="328"><tspan fill="#6f42c1">[no-exit-message]</tspan></text>
<text x="24" y="352"><tspan fill="#005cc5" font-weight="700">help</tspan><tspan fill="#e36209"> *verb</tspan>:</text>
<text x="60" y="376">#!/usr/bin/env sh</text>
<text x="60" y="400">if [ &quot;$#&quot; -eq 0 ]; then just --list --unsorted; exit 0; fi</text>
<text x="60" y="424">shown=$(just --show &quot;$1&quot;) || exit 1</text>
<text x="60" y="448">printf &#x27;%s\n&#x27; &quot;$shown&quot; | head -1 | sed &#x27;s/^# //&#x27;</text>
<text x="60" y="472">if printf &#x27;%s\n&#x27; &quot;$shown&quot; | grep -qF &#x27;<tspan fill="#d73a49">{{ &quot;{{ program }}</tspan>&quot; }} &#x27;&quot;$1&quot;; then</text>
<text x="96" y="496">uv run <tspan fill="#d73a49">{{ program }}</tspan> &quot;$1&quot; help</text>
<text x="60" y="520">fi</text>
<text x="24" y="568"><tspan fill="#6a737d" font-style="italic"># Install Python and every dependency into .venv, exactly as the lockfile says</tspan></text>
<text x="24" y="592"><tspan fill="#6f42c1">[group(&#x27;setup&#x27;)]</tspan></text>
<text x="24" y="616"><tspan fill="#005cc5" font-weight="700">setup</tspan><tspan fill="#e36209"> *args</tspan>:</text>
<text x="60" y="640">@<tspan fill="#d73a49">{{ if args == &quot;help&quot; { &quot;just help setup&quot; } else { &quot;uv sync --locked&quot; } }}</tspan></text>
</g>
<g stroke="#a85b00" stroke-width="1.8" fill="none">
<line x1="1017" y1="30.0" x2="838" y2="35" marker-end="url(#a)"/>
<line x1="1017" y1="78.0" x2="215" y2="83" marker-end="url(#a)"/>
<path d="M989,120 H995 V165 H989"/>
<line x1="1017" y1="138.0" x2="999" y2="143.0" marker-end="url(#a)"/>
<path d="M276,192 H282 V261 H276"/>
<line x1="1017" y1="222.0" x2="286" y2="227.0" marker-end="url(#a)"/>
<line x1="1017" y1="294.0" x2="892" y2="299" marker-end="url(#a)"/>
<line x1="1017" y1="332.5" x2="188" y2="323" marker-end="url(#a)"/>
<line x1="1017" y1="371.0" x2="133" y2="347" marker-end="url(#a)"/>
<path d="M709,360 H715 V525 H709"/>
<line x1="1017" y1="438.0" x2="719" y2="443.0" marker-end="url(#a)"/>
<line x1="1017" y1="582.0" x2="178" y2="587" marker-end="url(#a)"/>
<path d="M736,600 H742 V645 H736"/>
<line x1="1017" y1="630.0" x2="746" y2="623.0" marker-end="url(#a)"/>
</g>
<g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#17202b">
<text x="1025" y="35">A comment, for whoever opens the file</text>
<text x="1025" y="83">A variable. Below, {{ program }} becomes babykev</text>
<text x="1025" y="124">A setting for every recipe: just gives each word</text>
<text x="1025" y="143">after a recipe&#x27;s name to its commands whole,</text>
<text x="1025" y="162">as <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#a85b00">&quot;$1&quot;</tspan>, <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#a85b00">&quot;$2&quot;</tspan>, and all of them as <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#a85b00">&quot;$@&quot;</tspan></text>
<text x="1025" y="208">[private]: leave this recipe out of the list.</text>
<text x="1025" y="227">default: the first recipe, run by <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#a85b00">just</tspan> alone.</text>
<text x="1025" y="246">@: run the command without printing it first</text>
<text x="1025" y="290">The comment right above a recipe is its</text>
<text x="1025" y="308">description: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#a85b00">just</tspan> prints it in the list</text>
<text x="1025" y="338">[no-exit-message]: on failure, just adds no line of its own</text>
<text x="1025" y="366">A recipe named help. *verb takes any number</text>
<text x="1025" y="386">of words: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#a85b00">just help setup</tspan></text>
<text x="1025" y="414">#! makes the body one shell script, not a</text>
<text x="1025" y="434">command per line. It prints the recipe&#x27;s</text>
<text x="1025" y="452">description, then the program&#x27;s own help</text>
<text x="1025" y="472">when the recipe runs the program with its name</text>
<text x="1025" y="587">[group(&#x27;setup&#x27;)]: a heading in the list</text>
<text x="1025" y="616">*args: any words. {{ if … }} is just&#x27;s own if:</text>
<text x="1025" y="635"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#a85b00">just setup help</tspan> explains the recipe,</text>
<text x="1025" y="654"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#a85b00">just setup</tspan> runs uv sync --locked</text>
</g></svg>
