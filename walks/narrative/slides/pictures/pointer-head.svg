  <g font-size="16" fill="#17202b" text-anchor="middle">
    <rect x="290" y="50" width="170" height="50" rx="6" fill="#fbefdd" stroke="#a85b00"/>
    <text x="375" y="72" font-weight="600">Linear q</text><text x="375" y="91" font-size="13" fill="#4d5969">to 256 numbers</text>
    <rect x="290" y="210" width="170" height="62" rx="6" fill="#fbefdd" stroke="#a85b00"/>
    <text x="375" y="238" font-weight="600">Linear k</text><text x="375" y="258" font-size="13" fill="#4d5969">to 256 numbers, per option</text>
    <rect x="540" y="130" width="150" height="62" rx="6" fill="#e4ebf9" stroke="#2456b5"/>
    <text x="615" y="157" font-weight="600">dot product</text><text x="615" y="177" font-size="13" fill="#4d5969">one score per option</text>
    <rect x="760" y="130" width="170" height="62" rx="6" fill="#e4ebf9" stroke="#2456b5"/>
    <text x="845" y="157" font-weight="600">softmax</text><text x="845" y="177" font-size="13" fill="#4d5969">scores to probabilities</text>
  </g>
  <g stroke="#6f7b8b" stroke-width="2.5" fill="none">
    <path d="M214 75 H278"/><path d="M214 241 H278"/>
    <path d="M464 75 H500 Q520 75 520 95 V140 Q520 150 530 152"/>
    <path d="M464 241 H500 Q520 241 520 221 V182 Q520 172 530 170"/>
    <path d="M694 161 H748"/>
