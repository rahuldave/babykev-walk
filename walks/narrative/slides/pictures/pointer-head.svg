    <text x="120" y="81" font-family="ui-monospace, Menlo, monospace">&lt;decide&gt;</text>
    <rect x="30" y="170" width="180" height="42" rx="6" fill="#e3f4ea" stroke="#1d7a4c" stroke-width="2.5"/>
    <text x="120" y="197" font-family="ui-monospace, Menlo, monospace">&lt;/opt&gt; cow</text>
    <rect x="30" y="220" width="180" height="42" rx="6" fill="#e3f4ea" stroke="#1d7a4c" stroke-width="2.5"/>
    <text x="120" y="247" font-family="ui-monospace, Menlo, monospace">&lt;/opt&gt; sheep</text>
    <rect x="30" y="270" width="180" height="42" rx="6" fill="#e3f4ea" stroke="#1d7a4c" stroke-width="2.5"/>
    <text x="120" y="297" font-family="ui-monospace, Menlo, monospace">&lt;/opt&gt; goat</text>
