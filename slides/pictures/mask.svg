<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="400" y="26" font-size="16" fill="#4d5969" text-anchor="middle">… may look at earlier tokens of</text>
  <g font-size="17" font-weight="600" fill="#17202b" text-anchor="middle">
    <text x="250" y="56">the state</text><text x="400" y="56">question 1</text><text x="550" y="56">question 2</text>
  </g>
  <text x="20" y="92" font-size="16" fill="#4d5969">A token of …</text>
  <g font-size="17" font-weight="600" fill="#17202b">
    <text x="20" y="128">the state</text><text x="20" y="228">question 1</text><text x="20" y="328">question 2</text>
  </g>
  <g font-size="16" text-anchor="middle">
    <!-- row: state -->
    <rect x="180" y="72"  width="140" height="92" rx="6" fill="#e3f4ea" stroke="#1d7a4c"/><text x="250" y="124" fill="#17202b">yes</text>
    <rect x="330" y="72"  width="140" height="92" rx="6" fill="#eef1f5" stroke="#c3cad3"/><text x="400" y="124" fill="#6f7b8b">no: it comes later</text>
    <rect x="480" y="72"  width="140" height="92" rx="6" fill="#eef1f5" stroke="#c3cad3"/><text x="550" y="124" fill="#6f7b8b">no: it comes later</text>
    <!-- row: q1 -->
    <rect x="180" y="172" width="140" height="92" rx="6" fill="#e3f4ea" stroke="#1d7a4c"/><text x="250" y="224" fill="#17202b">yes, all of it</text>
    <rect x="330" y="172" width="140" height="92" rx="6" fill="#e3f4ea" stroke="#1d7a4c"/><text x="400" y="224" fill="#17202b">yes</text>
    <rect x="480" y="172" width="140" height="92" rx="6" fill="#eef1f5" stroke="#c3cad3"/><text x="550" y="224" fill="#6f7b8b">no: it comes later</text>
    <!-- row: q2 -->
    <rect x="180" y="272" width="140" height="92" rx="6" fill="#e3f4ea" stroke="#1d7a4c"/><text x="250" y="324" fill="#17202b">yes, all of it</text>
    <rect x="330" y="272" width="140" height="92" rx="6" fill="#fbe5e2" stroke="#b3261e" stroke-width="3"/><text x="400" y="316" fill="#b3261e" font-weight="700">NO</text><text x="400" y="338" fill="#b3261e" font-size="14">hidden by the mask</text>
    <rect x="480" y="272" width="140" height="92" rx="6" fill="#e3f4ea" stroke="#1d7a4c"/><text x="550" y="324" fill="#17202b">yes</text>
  </g>
  <path d="M400 366 V384 H648" stroke="#b3261e" stroke-width="2" fill="none"/>
  <g font-size="17" fill="#17202b">
    <text x="660" y="296">An ordinary causal mask</text>
    <text x="660" y="320">would say yes in the red cell.</text>
    <text x="660" y="364" font-weight="600">That one cell is the</text>
    <text x="660" y="388" font-weight="600">whole difference.</text>
  </g>
  <g font-size="16" fill="#4d5969">
    <text x="660" y="100">So question 2 gets the same</text>
    <text x="660" y="122">answer whether or not</text>
    <text x="660" y="144">question 1 was asked.</text>
  </g>
</svg>
