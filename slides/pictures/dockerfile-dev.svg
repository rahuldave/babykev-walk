<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 512">
<rect width="1420" height="512" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a85b00"/></marker></defs>
<rect x="12" y="18" width="921" height="478" rx="8" fill="#f6f8fa"/>
<g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#24292e">
<text x="24" y="40"><tspan fill="#005cc5" font-weight="700">FROM</tspan> python:3.13-slim-trixie AS <tspan fill="#d73a49" font-weight="700">dev</tspan></text>
<text x="24" y="64"><tspan fill="#005cc5" font-weight="700">ARG</tspan> TARGETARCH</text>
<text x="24" y="88"><tspan fill="#005cc5" font-weight="700">ARG</tspan> JUST=1.50.0</text>
<text x="24" y="112"><tspan fill="#005cc5" font-weight="700">ARG</tspan> QUARTO=1.8.26</text>
<text x="24" y="136"><tspan fill="#005cc5" font-weight="700">RUN</tspan> apt-get update \</text>
<text x="60" y="160">&amp;&amp; apt-get install --yes --no-install-recommends ca-certificates curl git \</text>
<text x="24" y="184">...</text>
<text x="24" y="208"><tspan fill="#005cc5" font-weight="700">RUN</tspan> curl --fail --silent --show-error --location --output /tmp/quarto.deb \</text>
<text x="24" y="232">...</text>
<text x="24" y="256"><tspan fill="#005cc5" font-weight="700">COPY</tspan> --from=uv /uv /uvx /usr/local/bin/</text>
<text x="24" y="280"><tspan fill="#005cc5" font-weight="700">RUN</tspan> uv tool install &quot;rust-just==${JUST}&quot; \</text>
<text x="60" y="304">&amp;&amp; git config --system --add safe.directory &#x27;*&#x27;</text>
<text x="24" y="328"><tspan fill="#005cc5" font-weight="700">WORKDIR</tspan> /work</text>
<text x="24" y="352"><tspan fill="#005cc5" font-weight="700">COPY</tspan> pyproject.toml uv.lock .python-version ./</text>
<text x="24" y="376"><tspan fill="#005cc5" font-weight="700">RUN</tspan> UV_COMPILE_BYTECODE=1 uv sync --locked --no-install-project</text>
<text x="24" y="400"><tspan fill="#005cc5" font-weight="700">COPY</tspan> . .</text>
<text x="24" y="424"><tspan fill="#005cc5" font-weight="700">RUN</tspan> uv sync --locked</text>
<text x="24" y="448"><tspan fill="#005cc5" font-weight="700">EXPOSE</tspan> 8765</text>
<text x="24" y="472"><tspan fill="#005cc5" font-weight="700">CMD</tspan> [&quot;bash&quot;]</text>
</g>
<g stroke="#a85b00" stroke-width="1.8" fill="none">
<line x1="967" y1="30.0" x2="350" y2="35" marker-end="url(#a)"/>
<path d="M745,120 H751 V165 H745"/>
<line x1="967" y1="138.0" x2="755" y2="143.0" marker-end="url(#a)"/>
<line x1="967" y1="198.0" x2="711" y2="203" marker-end="url(#a)"/>
<line x1="967" y1="246.0" x2="386" y2="251" marker-end="url(#a)"/>
<path d="M493,264 H499 V309 H493"/>
<line x1="967" y1="284.5" x2="503" y2="287.0" marker-end="url(#a)"/>
<path d="M601,336 H607 V381 H601"/>
<line x1="967" y1="354.0" x2="611" y2="359.0" marker-end="url(#a)"/>
<path d="M213,384 H219 V429 H213"/>
<line x1="967" y1="402.0" x2="223" y2="407.0" marker-end="url(#a)"/>
<line x1="967" y1="438.0" x2="133" y2="443" marker-end="url(#a)"/>
<line x1="967" y1="467.0" x2="142" y2="467" marker-end="url(#a)"/>
</g>
<g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#17202b">
<text x="975" y="26">The dev image: a fresh Python, as the run image starts.</text>
<text x="975" y="44">It shares nothing with <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#a85b00">build</tspan> or <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#a85b00">run</tspan></text>
<text x="975" y="143">git and curl, from Debian</text>
<text x="975" y="203">Quarto, from its release: the docs site needs it</text>
<text x="975" y="251">uv, copied out of the first stage</text>
<text x="975" y="280">just, from PyPI. git is told every folder is safe:</text>
<text x="975" y="299">a folder mounted from the host belongs to the host&#x27;s user</text>
<text x="975" y="350">The packages first, this time with the dev group: pytest,</text>
<text x="975" y="368">hypothesis, ruff, ty, hadolint and the rest of <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#a85b00">just check</tspan></text>
<text x="975" y="407">Then the whole project, and install it</text>
<text x="975" y="443">The port the step browser uses</text>
<text x="975" y="472">It starts a shell, not <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#a85b00">babykev</tspan></text>
</g></svg>
