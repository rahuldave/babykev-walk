<g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#17202b">
<text x="975" y="35">A list of places the hooks come from</text>
<text x="975" y="70">A collection of hooks published on GitHub, at version</text>
<text x="975" y="90">6.0.0. pre-commit downloads it once and keeps it</text>
<text x="975" y="146">Which of its hooks to run, by name. This one refuses</text>
<text x="975" y="164">any file over 1000 KB: <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#a85b00">args</tspan> are passed to the hook</text>
<text x="975" y="206">Refuses a file that still has the markers a merge</text>
<text x="975" y="224">conflict leaves, such as <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#a85b00">&lt;&lt;&lt;&lt;&lt;&lt;&lt;</tspan></text>
<text x="975" y="260">Hooks written here, in this file. Nothing to download</text>
<text x="975" y="310">Our first hook: its id, and the name pre-commit</text>
<text x="975" y="330">prints when it runs</text>
<text x="975" y="365">The message printed when the hook fails</text>
<text x="975" y="394"><tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#a85b00">fail</tspan>: this hook does nothing but fail, whenever</text>
<text x="975" y="413">it is given a file</text>
<text x="975" y="442">It is given only files that match this pattern:</text>
<text x="975" y="461">a file named <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#a85b00">.env</tspan>, in any folder</text>
<text x="975" y="490">Our second hook runs <tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#a85b00">just check</tspan>, the command as it</text>
<text x="975" y="510">is on this machine (<tspan font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" fill="#a85b00">system</tspan>)</text>
<text x="975" y="580">Do not add the changed files&#x27; names to the command,</text>
<text x="975" y="600">and run it at every commit, whatever changed</text>
</g></svg>
