<rect x="12" y="18" width="921" height="622" rx="8" fill="#f6f8fa"/>
<g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#24292e">
<text x="24" y="40"><tspan fill="#005cc5">repos</tspan>:<tspan fill="#032f62"></tspan></text>
<text x="42" y="70"><tspan fill="#d73a49">- </tspan><tspan fill="#005cc5">repo</tspan>:<tspan fill="#032f62"> https://github.com/pre-commit/pre-commit-hooks</tspan></text>
<text x="60" y="100"><tspan fill="#005cc5">rev</tspan>:<tspan fill="#032f62"> v6.0.0</tspan></text>
<text x="60" y="130"><tspan fill="#005cc5">hooks</tspan>:<tspan fill="#032f62"></tspan></text>
<text x="78" y="160"><tspan fill="#d73a49">- </tspan><tspan fill="#005cc5">id</tspan>:<tspan fill="#032f62"> check-added-large-files</tspan></text>
<text x="96" y="190"><tspan fill="#005cc5">args</tspan>:<tspan fill="#032f62"> [--maxkb=1000]</tspan></text>
<text x="78" y="220"><tspan fill="#d73a49">- </tspan><tspan fill="#005cc5">id</tspan>:<tspan fill="#032f62"> check-merge-conflict</tspan></text>
<text x="42" y="250"><tspan fill="#d73a49">- </tspan><tspan fill="#005cc5">repo</tspan>:<tspan fill="#032f62"> local</tspan></text>
<text x="60" y="280"><tspan fill="#005cc5">hooks</tspan>:<tspan fill="#032f62"></tspan></text>
<text x="78" y="310"><tspan fill="#d73a49">- </tspan><tspan fill="#005cc5">id</tspan>:<tspan fill="#032f62"> no-env-file</tspan></text>
<text x="96" y="340"><tspan fill="#005cc5">name</tspan>:<tspan fill="#032f62"> no .env file</tspan></text>
<text x="96" y="370"><tspan fill="#005cc5">entry</tspan>:<tspan fill="#032f62"> A .env file holds the settings and secrets of one machine. It is never committed</tspan></text>
<text x="96" y="400"><tspan fill="#005cc5">language</tspan>:<tspan fill="#032f62"> fail</tspan></text>
<text x="96" y="430"><tspan fill="#005cc5">files</tspan>:<tspan fill="#032f62"> (^|/)\.env$</tspan></text>
<text x="78" y="460"><tspan fill="#d73a49">- </tspan><tspan fill="#005cc5">id</tspan>:<tspan fill="#032f62"> check</tspan></text>
<text x="96" y="490"><tspan fill="#005cc5">name</tspan>:<tspan fill="#032f62"> just check</tspan></text>
<text x="96" y="520"><tspan fill="#005cc5">entry</tspan>:<tspan fill="#032f62"> just check</tspan></text>
<text x="96" y="550"><tspan fill="#005cc5">language</tspan>:<tspan fill="#032f62"> system</tspan></text>
<text x="96" y="580"><tspan fill="#005cc5">pass_filenames</tspan>:<tspan fill="#032f62"> false</tspan></text>
<text x="96" y="610"><tspan fill="#005cc5">always_run</tspan>:<tspan fill="#032f62"> true</tspan></text>
